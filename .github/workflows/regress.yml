name: analog-ready regression gate

# Reusable workflow: call it from another repo with
#   jobs:
#     gate:
#       uses: demirelo/analog-ready/.github/workflows/regress.yml@v0.1.0
#       with:
#         model: mlp
#         profile: profiles/my_device.yaml   # a path in YOUR checkout, or a builtin name
#         baseline: ci/analog-ready-baseline.json
#
# `on: workflow_call` means this never runs on push/PR of THIS repo — only when another workflow
# calls it — so it cannot break analog-ready's own CI.
on:
  workflow_call:
    inputs:
      model:
        description: "zoo model name"
        required: true
        type: string
      profile:
        description: "builtin profile name or a path in the caller's checkout"
        required: true
        type: string
      baseline:
        description: "path (in the caller's checkout) to the committed baseline run-summary JSON"
        required: true
        type: string
      ref:
        description: "analog-ready git ref to install (tag/branch/sha)"
        required: false
        type: string
        default: "v0.1.0"
      python-version:
        description: "Python version to run the gate on"
        required: false
        type: string
        default: "3.12"
      redact:
        description: "omit the model identity from the shared envelope"
        required: false
        type: boolean
        default: false

jobs:
  regress:
    runs-on: ubuntu-latest
    steps:
      - name: Check out caller repo (baseline + custom profile)
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install analog-ready
        run: pip install "analog-ready @ git+https://github.com/demirelo/analog-ready@${{ inputs.ref }}"

      - name: Summarize current run
        run: >-
          analog-ready summarize
          --model "${{ inputs.model }}"
          --profile "${{ inputs.profile }}"
          --out analog-ready-current.json

      - name: Regress against committed baseline (fail-closed)
        run: |
          redact_flag=""
          if [ "${{ inputs.redact }}" = "true" ]; then redact_flag="--redact"; fi
          analog-ready regress \
            --baseline "${{ inputs.baseline }}" \
            --current analog-ready-current.json \
            $redact_flag \
            --out analog-ready-envelope.json

      - name: Upload regression envelope
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analog-ready-envelope
          path: analog-ready-envelope.json
          if-no-files-found: ignore
