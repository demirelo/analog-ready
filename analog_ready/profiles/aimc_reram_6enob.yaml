name: aimc_reram_6enob
visibility: private
# ReRAM analog crossbar, ~6 ENOB analog dynamic range. Defaults from the same literature;
# not measured silicon.
fields:
  weight_bits:            {value: 4,       redaction: exact_ok}
  input_bits:             {value: 4,       redaction: exact_ok}
  enob_avail:             {value: 6.0,     redaction: bucket}
  adc_full_scale:         {value: 0.85,    redaction: exact_ok, provenance: estimate}  # fixed ADC full-scale (W12)
  array_rows:             {value: 128,     redaction: exact_ok}
  array_cols:             {value: 128,     redaction: exact_ok}
  mac_energy_pj:          {value: 0.03,    redaction: bucket}
  adc_energy_pj:          {value: 3.17,    redaction: bucket}
  dac_energy_pj:          {value: 10.0,    redaction: bucket}
  mem_energy_pj_per_byte: {value: 0.1,     redaction: hidden}
  digital_mac_energy_pj:  {value: 0.07,    redaction: exact_ok}
  weight_program_energy_pj: {value: 3.5,   redaction: bucket}   # ReRAM write; sets reuse threshold Y
  peak_flops:             {value: 8.0e11,  redaction: exact_ok}
  peak_bw_bytes:          {value: 1.0e11,  redaction: exact_ok}
  # Analog weight-programming noise (W7): proportional programming-error + read/thermal floor,
  # see analog_ready/device_noise.py. ReRAM has the widest programming variability of the three
  # (lowest ENOB, most stochastic filament formation); literature-plausible defaults (aihwkit
  # RPUConfig; Joshi 2020 arXiv:1906.03138; Le Gallo 2023 arXiv:2212.02872), NOT measured silicon.
  # Hidden: a vendor's characterised noise floor is crown-jewel IP.
  prog_noise_sigma:       {value: 0.10,    redaction: hidden}
  read_noise_sigma:       {value: 0.02,    redaction: hidden}
  # Conductance DRIFT (W8): power-law decay G(t) = G0*(t/t0)^-nu, see analog_ready/drift.py.
  # ReRAM drifts faster and less predictably than PCM (filament-formation variability), so both the
  # exponent and its spread are set higher than PCM's. NOTE: unlike PCM, ReRAM/OxRAM drift is NOT a
  # well-established power-law materials constant in the literature — this is an ENGINEERING ESTIMATE
  # by analogy to PCM (Joshi 2020 arXiv:1906.03138; Le Gallo 2023 arXiv:2212.02872; aihwkit
  # PCMLikeNoiseModel are PCM-specific), not measured silicon. drift_sigma_nu (device-to-device
  # spread -- the actual accuracy-relevant parameter) is characterisation IP (hidden).
  drift_nu:               {value: 0.08,    redaction: bucket}
  drift_sigma_nu:         {value: 0.05,    redaction: hidden}
