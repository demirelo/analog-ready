name: "analog-ready regression gate"
description: >-
  Fail-closed analog-readiness CI gate: summarize a (zoo model x hardware profile) run and compare
  it to a committed baseline. Exits non-zero on a real regression (favorability/fidelity drop or a
  break-even flip), and writes a redactable, shareable envelope.
author: "analog-ready"
branding:
  icon: cpu
  color: purple

inputs:
  model:
    description: "zoo model name (mlp, tiny_resnet, gpt2_block, synthetic_gemm)"
    required: true
  profile:
    description: "builtin profile name (aimc_pcm_4bit, aimc_reram_6enob, aimc_sram_8bit, photonic_clements_mzi) or a path to your own profile YAML"
    required: true
  baseline:
    description: "path (in the caller's checkout) to the committed baseline run-summary JSON, produced once with `analog-ready summarize`"
    required: true
  python-version:
    description: "Python version to run the gate on"
    required: false
    default: "3.12"
  redact:
    description: "omit the model identity from the shared envelope ('true' or 'false')"
    required: false
    default: "false"
  envelope-out:
    description: "where to write the shareable regression envelope"
    required: false
    default: "analog-ready-envelope.json"

outputs:
  envelope:
    description: "path to the written regression envelope"
    value: ${{ inputs.envelope-out }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install analog-ready
      shell: bash
      # Install this action's own copy (github.action_path is where the action is checked out);
      # no PyPI dependency. Once analog-ready is published, `pip install analog-ready==<v>` is cleaner.
      run: pip install "${{ github.action_path }}"

    - name: Summarize current run
      shell: bash
      run: >-
        analog-ready summarize
        --model "${{ inputs.model }}"
        --profile "${{ inputs.profile }}"
        --out analog-ready-current.json

    - name: Regress against committed baseline (fail-closed)
      shell: bash
      # `regress` returns 0 = no regression, 1 = regression, 2 = unreadable input — all propagate as
      # the step's exit code, so a regression fails the job. Envelope is written even on a failure.
      run: |
        redact_flag=""
        if [ "${{ inputs.redact }}" = "true" ]; then redact_flag="--redact"; fi
        analog-ready regress \
          --baseline "${{ inputs.baseline }}" \
          --current analog-ready-current.json \
          $redact_flag \
          --out "${{ inputs.envelope-out }}"
